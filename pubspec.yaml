name: ecommerce_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.3

#! ==================================  Dependencies  Section  ==============================
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  #* ================== Used Packages In My Project ==================
  dio: ^5.7.0
  shared_preferences: ^2.3.4
  dartz: ^0.10.1
  flutter_svg: ^2.0.16
  flutter_launcher_icons: ^0.14.2
  dots_indicator: ^3.0.0
  get_it: ^8.0.3
  modal_progress_hud_nsn: ^0.5.1
  flutter_svg_provider: ^1.0.7
  persistent_bottom_nav_bar: ^6.2.1
  intl: ^0.20.1
  flutter_bloc: ^8.1.6
  email_validator: ^3.0.0
  

#! ==================================  Dev  Dependencies  Section  ==============================
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 24 # android min sdk min:16, default 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"

  # The "flutter_lints" package below contains a set of recommended lints to
  flutter_lints: ^4.0.0

#! ==================================  Flutter  Section Add Images and Fonts ==============================
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/vectors/
    - assets/icons/

  # To add assets to your application, add an assets section, like this:
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
  
#! ==================================  Generate  Flutter  Assets  Section  ==============================
flutter_assets:
  assets_path: assets/vectors/
  output_path: lib/core/utils/
  filename: assets.dart
flutter_intl:
  enabled: true